<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #17181c; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 28px 32px; }

.card {
  background: #26282e;
  border: 1px solid #34363d;
  border-radius: 16px;
  display: flex;
  align-items: center;
  gap: 0;
}
.stc-area {
  flex: 1;
  background: #26282e;
  color: #e7e9ee;
  border: none;
  outline: none;
  padding: 12px 14px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  resize: none;
  min-height: 52px;
  margin: 10px;
  caret-color: #5b9bff;
  line-height: 1.5;
}
.stc-area::placeholder { color: #4a5060; }
.btn-flat {
  background: none; border: 1px solid #34363d; color: #9aa0ab;
  border-radius: 10px; padding: 9px 16px; font-size: 13px;
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  font-family: inherit;
}
.btn-send {
  background: #5b9bff; border: none; color: #fff;
  border-radius: 10px; padding: 9px 18px; font-size: 13px;
  font-weight: 600; margin-right: 8px; flex-shrink: 0;
  font-family: inherit; cursor: pointer;
}
</style></head>
<body>
<div class="card">
  <textarea class="stc-area" placeholder="Ask an engineering question…" rows="2"></textarea>
  <button class="btn-flat">Capture</button>&nbsp;&nbsp;
  <button class="btn-send">Envoyer</button>
</div>
</body></html>
