<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #17181c; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 28px 32px; display:flex; flex-direction:column; gap:28px; }
label { color:#9aa0ab; font-size:11px; text-transform:uppercase; letter-spacing:.6px; margin-bottom:8px; display:block; }

/* AVANT: fond blanc du TextCtrl qui dépasse */
.card { background:#26282e; border:1px solid #34363d; border-radius:16px; display:flex; align-items:center; overflow:hidden; }
.card-bad textarea {
  flex:1; background:white; color:#111; border:none; outline:none;
  padding:12px 14px; font-family:inherit; font-size:14px; resize:none;
  min-height:52px; margin:10px; border-radius:4px;
}
/* APRÈS: correction appliquée */
.card-good textarea {
  flex:1; background:#26282e; color:#e7e9ee; border:none; outline:none;
  padding:12px 14px; font-family:inherit; font-size:14px; resize:none;
  min-height:52px; margin:10px;
  caret-color:#5b9bff;
}
.card-good textarea::placeholder { color:#5a6070; }
.btn-flat { background:none; border:1px solid #34363d; color:#9aa0ab; border-radius:10px; padding:9px 16px; font-size:13px; cursor:pointer; white-space:nowrap; flex-shrink:0; font-family:inherit; }
.btn-flat:hover { background:#2f3138; }
.btn-send { background:#5b9bff; border:none; color:#fff; border-radius:10px; padding:9px 18px; font-size:13px; font-weight:600; margin-right:8px; flex-shrink:0; font-family:inherit; cursor:pointer; }
.btn-send:hover { background:#4a8cf0; }
.gap { width:8px; flex-shrink:0; }
</style>
</head>
<body>

<div>
  <label>⚠ Avant (glitch macOS — NSTextView ignore la couleur de fond)</label>
  <div class="card card-bad">
    <textarea placeholder="Ask an engineering question…  (Enter to send, Shift+Enter for new line)"></textarea>
    <button class="btn-flat">Capture</button>
    <div class="gap"></div>
    <button class="btn-send">Envoyer</button>
  </div>
</div>

<div>
  <label>✓ Après correction (CallAfter + SetDefaultStyle)</label>
  <div class="card card-good">
    <textarea placeholder="Ask an engineering question…  (Enter to send, Shift+Enter for new line)"></textarea>
    <button class="btn-flat">Capture</button>
    <div class="gap"></div>
    <button class="btn-send">Envoyer</button>
  </div>
</div>

</body></html>
